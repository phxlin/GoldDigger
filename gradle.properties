org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Gradle 8.13 supports Java 8-23; Android Studio 2026.1 bundles JBR 25.
# No org.gradle.java.home is pinned here — that's a machine-specific path
# that would break every other contributor's build. Point Gradle at a JDK
# via Android Studio's own Gradle JDK setting, a JAVA_HOME environment
# variable, or (for a personal override that never gets committed) your own
# ~/.gradle/gradle.properties.
org.gradle.configuration-cache=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
ksp.incremental=true
